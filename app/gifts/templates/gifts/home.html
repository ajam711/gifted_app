{% extends "gifts/base.html" %}
{% block title %}Home · Gifted{% endblock %}
{% block content %}
  <h1>Lists</h1>
  <nav class="doors">
    <a class="door" href="{% url 'my_list' %}">
      <span class="door-kicker">Your list</span>
      <span class="door-name">{{ person.name }}</span>
    </a>
    {% if partner %}
      <a class="door" href="{% url 'their_list' %}">
        <span class="door-kicker">Their list</span>
        <span class="door-name">{{ partner.name }}</span>
      </a>
    {% endif %}
  </nav>
{% endblock %}
