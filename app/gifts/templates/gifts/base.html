{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gifted{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'gifts/app.css' %}">
</head>
<body>
  <header class="site">
    <a class="wordmark" href="{% url 'home' %}">Gifted</a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="logout">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% if messages %}
      <ul class="messages" role="status" aria-live="polite">
        {% for message in messages %}
          <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'gifts/htmx.min.js' %}" defer></script>
</body>
</html>
